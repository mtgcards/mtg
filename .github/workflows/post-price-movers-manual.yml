name: Generate Price Movers for Manual Post

on:
  schedule:
    # 毎日 JST 20:00 = UTC 11:00
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore generated cache
        uses: actions/cache/restore@v4
        with:
          path: src/generated
          key: generated-${{ github.sha }}
          restore-keys: generated-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate tweet for manual post
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: node scripts/post-price-movers-manual.js

      - name: Upload manual post artifacts
        uses: actions/upload-artifact@v4
        with:
          name: manual-post-${{ github.run_number }}
          path: tmp/manual-post/
          retention-days: 3
